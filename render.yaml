services:
  - type: web
    name: nuvio-live-sports-addon
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: STREAMED_ENABLED
        value: true
      - key: STREAMED_BASES
        value: https://streamed.pk,https://streamed.st
      - key: STREAMED_DISCOVER_OFFICIAL_MIRRORS
        value: true
      - key: STREAMED_MIRROR_INDEX
        value: https://strmd.link/
      - key: ROXIE_ENABLED
        value: true
      - key: ROXIE_BASE_URL
        value: https://roxiestreams.su
      - key: ROXIE_EVENT_MAP_JSON
        value: '[{"sourceId":"live-event_monday-night-raw-live-stream","match":"Monday Night Raw","aliases":["WWE Raw","Raw"],"category":"wrestling","webUrl":"https://roxiestreams.su/wwe-streams"}]'
      - key: CACHE_TTL_SECONDS
        value: 60
